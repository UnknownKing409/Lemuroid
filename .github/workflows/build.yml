name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :lemuroid-app:assembleFreeRelease -Pandroid.injected.build.abi=arm64-v8a -Darch=arm64 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lemuroid-arm64-release
          path: '**/*arm64-v8a*.apk'
          if-no-files-found: warn
          archive: false
